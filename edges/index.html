<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Four-Edge Sequential Menu</title>
  <style>
    body {
      margin: 0;
      padding: 0; /* Full-bleed */
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden; /* Prevent scrollbars */
    }
    nav {
      background-color: #333;
      position: fixed;
      z-index: 1000;
    }
    /* Top Bar */
    .nav-top {
      width: 100%;
      top: 0;
      left: 0;
      height: 40px;
    }
    /* Bottom Bar */
    .nav-bottom {
      width: 100%;
      bottom: 0;
      left: 0;
      height: 40px;
    }
    /* Left Bar */
    .nav-left {
      height: 100vh;
      width: 40px;
      top: 0;
      left: 0;
    }
    /* Right Bar */
    .nav-right {
      height: 100vh;
      width: 40px;
      top: 0;
      right: 0;
    }
    .menu {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
    }
    /* Ensure full height for left/right menus */
    .nav-left .menu, .nav-right .menu {
      height: 100%;
      flex-direction: column;
    }
    .menu-item {
      position: relative;
      cursor: pointer;
    }
    /* Top and Bottom Menu Items */
    .nav-top .menu-item, .nav-bottom .menu-item {
      width: 100%;
      height: 40px;
    }
    /* Left and Right Menu Items */
    .nav-left .menu-item, .nav-right .menu-item {
      height: 100%;
      width: 40px;
    }
    .dropdown {
      position: absolute;
      background-color: #444;
      list-style: none;
      padding: 0;
      margin: 0;
      overflow: hidden;
      transition: all 0.5s ease-in-out; /* Smoother transition */
    }
    /* Top Dropdown */
    .nav-top .dropdown {
      top: 100%;
      left: 0;
      width: 100%;
      max-height: 0;
    }
    .nav-top .show {
      max-height: 50vh; /* Half viewport height downward */
    }
    /* Bottom Dropdown */
    .nav-bottom .dropdown {
      bottom: 100%;
      left: 0;
      width: 100%;
      max-height: 0;
    }
    .nav-bottom .show {
      max-height: 50vh; /* Half viewport height upward */
    }
    /* Left Dropdown */
    .nav-left .dropdown {
      left: 100%;
      top: 0;
      height: 100vh;
      max-width: 0;
    }
    .nav-left .show {
      max-width: 50vw; /* Half viewport width rightward */
    }
    /* Right Dropdown */
    .nav-right .dropdown {
      right: 100%;
      top: 0;
      height: 100vh;
      max-width: 0;
    }
    .nav-right .show {
      max-width: 50vw; /* Half viewport width leftward */
    }
    .dropdown li {
      background-color: #444;
    }
    /* Dropdown Content Size */
    .nav-top .dropdown li, .nav-bottom .dropdown li {
      height: calc(50vh - 40px); /* Fill dropdown height */
      padding: 20px;
    }
    .nav-left .dropdown li, .nav-right .dropdown li {
      width: calc(50vw - 40px); /* Fill dropdown width */
      height: 100%;
      padding: 20px;
    }
  </style>
</head>
<body>
  <!-- Top Bar -->
  <nav class="nav-top">
    <ul class="menu">
      <li class="menu-item">
        <ul class="dropdown">
          <li></li> <!-- Empty dropdown item -->
        </ul>
      </li>
    </ul>
  </nav>
  <!-- Right Bar -->
  <nav class="nav-right">
    <ul class="menu">
      <li class="menu-item">
        <ul class="dropdown">
          <li></li> <!-- Empty dropdown item -->
        </ul>
      </li>
    </ul>
  </nav>
  <!-- Bottom Bar -->
  <nav class="nav-bottom">
    <ul class="menu">
      <li class="menu-item">
        <ul class="dropdown">
          <li></li> <!-- Empty dropdown item -->
        </ul>
      </li>
    </ul>
  </nav>
  <!-- Left Bar -->
  <nav class="nav-left">
    <ul class="menu">
      <li class="menu-item">
        <ul class="dropdown">
          <li></li> <!-- Empty dropdown item -->
        </ul>
      </li>
    </ul>
  </nav>
  <script>
    // Constants and State
    const menus = [
      document.querySelector('.nav-top .dropdown'),
      document.querySelector('.nav-right .dropdown'),
      document.querySelector('.nav-bottom .dropdown'),
      document.querySelector('.nav-left .dropdown')
    ];
    let currentMenuIndex = 0;
    const expandDuration = 1000; // 1s expand/collapse time

    // Logic
    startMenuSequence();

    // Functions
    function startMenuSequence() {
      showNextMenu();
    }

    function showNextMenu() {
      // Remove show class from all menus
      menus.forEach(menu => menu.classList.remove('show'));

      // Add show class to current menu
      menus[currentMenuIndex].classList.add('show');

      // Schedule collapse and move to next menu
      setTimeout(() => {
        menus[currentMenuIndex].classList.remove('show');
        currentMenuIndex = (currentMenuIndex + 1) % menus.length;
        showNextMenu();
      }, expandDuration);
    }

    // Helper Functions
    // None needed for now
  </script>
</body>
</html>
