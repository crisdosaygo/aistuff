<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 9x Demo</title>
    <style>
        body {
            background-color: #008080; /* Classic Teal */
            font-family: "MS Sans Serif", "Tahoma", Arial, sans-serif;
            font-size: 12px;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        .desktop {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 30px; /* Space for taskbar */
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: flex-start; /* Align icons to the left */
        }

        .desktop-icon {
            width: 75px;
            margin: 10px;
            text-align: center;
            color: white;
            cursor: pointer;
            padding: 5px;
        }
        .desktop-icon:hover {
            background-color: rgba(0, 0, 128, 0.5); /* Dark blue transparent */
            outline: 1px dotted white;
        }
        .desktop-icon img {
            width: 32px;
            height: 32px;
            display: block;
            margin: 0 auto 5px auto;
        }

        .taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30px;
            background-color: #c0c0c0; /* Classic Gray */
            border-top: 2px solid #ffffff;
            display: flex;
            align-items: center;
            padding: 0 5px;
            z-index: 10000; /* Always on top */
        }

        .start-button {
            background-color: #c0c0c0;
            border: 2px outset #dfdfdf;
            padding: 2px 10px;
            margin-right: 5px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .start-button:active {
            border-style: inset;
        }
        .start-button img {
            width: 16px;
            height: 16px;
            margin-right: 5px;
        }

        .start-menu {
            position: absolute;
            bottom: 30px; /* Above taskbar */
            left: 0;
            width: 180px;
            background-color: #c0c0c0;
            border: 2px outset #dfdfdf;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            padding: 2px;
            display: none; /* Hidden by default */
            z-index: 9999;
        }
        .start-menu-item {
            padding: 5px 10px 5px 25px; /* Space for potential icon */
            cursor: pointer;
            position: relative;
        }
        .start-menu-item:hover {
            background-color: #000080; /* Dark Blue */
            color: white;
        }
        .start-menu-separator {
            height: 1px;
            background-color: #808080;
            margin: 2px 0;
            border-bottom: 1px solid #ffffff;
        }
        .start-menu-item.disabled {
            color: #808080;
            cursor: default;
        }
        .start-menu-item.disabled:hover {
            background-color: #c0c0c0;
            color: #808080;
        }


        .taskbar-windows {
            display: flex;
            flex-grow: 1;
            margin: 0 5px;
            overflow: hidden;
        }
        .taskbar-button {
            background-color: #c0c0c0;
            border: 2px outset #dfdfdf;
            padding: 2px 8px;
            margin-right: 3px;
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
            cursor: pointer;
        }
        .taskbar-button.active {
            border-style: inset;
            font-weight: bold;
        }


        .clock {
            border: 1px inset #808080;
            padding: 3px 8px;
            margin-left: auto; /* Pushes to the right */
            font-size: 11px;
            min-width: 60px;
            text-align: center;
        }

        /* Window Styling */
        .window {
            position: absolute;
            background-color: #c0c0c0;
            border: 2px outset #dfdfdf;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            min-width: 200px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
        }

        .window-titlebar {
            background-color: #000080; /* Dark Blue */
            color: white;
            padding: 3px 5px;
            font-weight: bold;
            cursor: grab;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .window-titlebar:active {
            cursor: grabbing;
        }
        .window-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .window-controls button {
            background-color: #c0c0c0;
            border: 1px outset #dfdfdf;
            color: black;
            font-family: "Marlett", "Webdings"; /* For symbols, Marlett is classic */
            font-size: 10px; /* Adjust if symbols are too big/small */
            width: 16px;
            height: 14px;
            line-height: 10px; /* Center symbol */
            padding: 0;
            margin-left: 2px;
            cursor: pointer;
        }
        .window-controls button:active {
            border-style: inset;
        }

        .window-content {
            padding: 10px;
            background-color: #ffffff; /* White content area */
            flex-grow: 1;
            margin: 3px;
            border: 1px inset #808080;
            overflow: auto; /* Add scrollbars if content overflows */
        }
    </style>
</head>
<body>

    <div class="desktop" id="desktop">
        <!-- Desktop Icons will be added here by JS or statically -->
        <div class="desktop-icon" data-app-id="myComputer" data-app-title="My Computer">
            <img src="https://win98icons.alexmeub.com/icons/png/computer_explorer-0.png" alt="My Computer">
            <span>My Computer</span>
        </div>
        <div class="desktop-icon" data-app-id="notepad" data-app-title="Notepad">
            <img src="https://win98icons.alexmeub.com/icons/png/notepad-0.png" alt="Notepad">
            <span>Notepad</span>
        </div>
        <div class="desktop-icon" data-app-id="recycleBin" data-app-title="Recycle Bin">
            <img src="https://win98icons.alexmeub.com/icons/png/recycle_bin_empty-0.png" alt="Recycle Bin">
            <span>Recycle Bin</span>
        </div>
    </div>

    <div class="start-menu" id="startMenu">
        <div class="start-menu-item" data-app-id="notepad" data-app-title="Notepad">📝 Notepad</div>
        <div class="start-menu-item" data-app-id="myComputer" data-app-title="My Computer">💻 My Computer</div>
        <div class="start-menu-separator"></div>
        <div class="start-menu-item disabled">⚙️ Settings</div>
        <div class="start-menu-item disabled">❓ Help</div>
        <div class="start-menu-separator"></div>
        <div class="start-menu-item" id="shutdownButton">🔌 Shut Down...</div>
    </div>

    <div class="taskbar">
        <button class="start-button" id="startButton">
            <img src="https://win98icons.alexmeub.com/icons/png/windows-0.png" alt="Start">
            Start
        </button>
        <div class="taskbar-windows" id="taskbarWindows">
            <!-- Taskbar buttons for open windows go here -->
        </div>
        <div class="clock" id="clock"></div>
    </div>

    <!-- Window Template (hidden) -->
    <template id="windowTemplate">
        <div class="window">
            <div class="window-titlebar">
                <span class="window-title">Window</span>
                <div class="window-controls">
                    <button class="window-close-btn" title="Close">r</button> <!-- 'r' in Marlett is close 'x' -->
                </div>
            </div>
            <div class="window-content">
                <p>This is a window.</p>
            </div>
        </div>
    </template>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const clockElement = document.getElementById('clock');
            const startButton = document.getElementById('startButton');
            const startMenu = document.getElementById('startMenu');
            const desktop = document.getElementById('desktop');
            const windowTemplate = document.getElementById('windowTemplate');
            const taskbarWindows = document.getElementById('taskbarWindows');

            let highestZIndex = 100;
            let openWindows = {}; // To keep track of open windows and their taskbar buttons

            // --- Clock ---
            function updateClock() {
                const now = new Date();
                const hours = now.getHours().toString().padStart(2, '0');
                const minutes = now.getMinutes().toString().padStart(2, '0');
                clockElement.textContent = `${hours}:${minutes}`;
            }
            setInterval(updateClock, 1000);
            updateClock();

            // --- Start Menu ---
            startButton.addEventListener('click', (event) => {
                event.stopPropagation(); // Prevent click from bubbling to document
                startMenu.style.display = startMenu.style.display === 'block' ? 'none' : 'block';
            });

            document.addEventListener('click', (event) => {
                // Close start menu if clicking outside
                if (startMenu.style.display === 'block' && !startMenu.contains(event.target) && event.target !== startButton) {
                    startMenu.style.display = 'none';
                }
            });

            // --- Window Management ---
            let windowIdCounter = 0;

            function createWindow(appId, title, content = `<p>Content for ${title}.</p>`) {
                startMenu.style.display = 'none'; // Close start menu when opening app

                // Prevent opening multiple instances of the same "app" for this basic demo
                // Or, focus existing window if already open
                const existingWindow = document.querySelector(`.window[data-app-id="${appId}"]`);
                if (existingWindow) {
                    focusWindow(existingWindow);
                    return;
                }

                const windowInstanceId = `window-${appId}-${windowIdCounter++}`;
                const windowEl = windowTemplate.content.firstElementChild.cloneNode(true);
                windowEl.dataset.appId = appId;
                windowEl.dataset.instanceId = windowInstanceId;

                windowEl.querySelector('.window-title').textContent = title;
                windowEl.querySelector('.window-content').innerHTML = content;

                // Random initial position (simplified)
                windowEl.style.left = `${Math.random() * (desktop.offsetWidth - 250) + 20}px`;
                windowEl.style.top = `${Math.random() * (desktop.offsetHeight - 200) + 20}px`;
                
                highestZIndex++;
                windowEl.style.zIndex = highestZIndex;

                desktop.appendChild(windowEl);
                makeDraggable(windowEl);
                addWindowToTaskbar(windowEl, title, windowInstanceId);
                focusWindow(windowEl);


                windowEl.querySelector('.window-close-btn').addEventListener('click', () => {
                    closeWindow(windowEl);
                });

                windowEl.addEventListener('mousedown', () => {
                    focusWindow(windowEl);
                });
                return windowEl;
            }

            function focusWindow(windowEl) {
                highestZIndex++;
                windowEl.style.zIndex = highestZIndex;
                // Update taskbar active state
                document.querySelectorAll('.taskbar-button').forEach(btn => btn.classList.remove('active'));
                const taskbarBtn = openWindows[windowEl.dataset.instanceId]?.taskbarButton;
                if (taskbarBtn) {
                    taskbarBtn.classList.add('active');
                }
            }

            function closeWindow(windowEl) {
                const instanceId = windowEl.dataset.instanceId;
                if (openWindows[instanceId]) {
                    openWindows[instanceId].taskbarButton.remove();
                    delete openWindows[instanceId];
                }
                windowEl.remove();
            }

            function addWindowToTaskbar(windowEl, title, instanceId) {
                const taskbarButton = document.createElement('button');
                taskbarButton.className = 'taskbar-button';
                taskbarButton.textContent = title;
                taskbarButton.dataset.windowInstanceId = instanceId;
                
                taskbarButton.addEventListener('click', () => {
                    focusWindow(windowEl);
                });

                taskbarWindows.appendChild(taskbarButton);
                openWindows[instanceId] = { window: windowEl, taskbarButton: taskbarButton };
            }


            function makeDraggable(element) {
                const titleBar = element.querySelector('.window-titlebar');
                let offsetX, offsetY, isDragging = false;

                titleBar.addEventListener('mousedown', (e) => {
                    // Prevent dragging if clicking on a control button
                    if (e.target.closest('.window-controls button')) return;

                    isDragging = true;
                    offsetX = e.clientX - element.getBoundingClientRect().left;
                    offsetY = e.clientY - element.getBoundingClientRect().top;
                    element.style.cursor = 'grabbing'; // Should be on titlebar, but this is simpler
                    titleBar.style.cursor = 'grabbing';
                    focusWindow(element); // Bring to front when starting drag
                });

                document.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    let newX = e.clientX - offsetX;
                    let newY = e.clientY - offsetY;

                    // Keep window within desktop bounds (approximate)
                    const desktopRect = desktop.getBoundingClientRect();
                    newX = Math.max(0, Math.min(newX, desktopRect.width - element.offsetWidth));
                    newY = Math.max(0, Math.min(newY, desktopRect.height - element.offsetHeight));

                    element.style.left = `${newX}px`;
                    element.style.top = `${newY}px`;
                });

                document.addEventListener('mouseup', () => {
                    if (isDragging) {
                        isDragging = false;
                        element.style.cursor = 'default';
                        titleBar.style.cursor = 'grab';
                    }
                });
            }

            // --- Icon/Menu Item Click Handlers ---
            document.querySelectorAll('.desktop-icon, .start-menu-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (item.classList.contains('disabled')) return;

                    const appId = item.dataset.appId;
                    const appTitle = item.dataset.appTitle || item.textContent.trim();

                    if (appId === 'shutdownButton' || item.id === 'shutdownButton') {
                        alert('Shutting down is not implemented in this demo! 😉');
                        startMenu.style.display = 'none';
                        return;
                    }
                    
                    if (appId) {
                        let content = `<p>This is the "${appTitle}" application window.</p>`;
                        if (appId === "notepad") {
                            content = `<textarea style="width: 98%; height: 90%; border: 1px solid #777; font-family: 'Courier New', monospace; font-size:12px; resize:none;" placeholder="Type something..."></textarea>`;
                        } else if (appId === "myComputer") {
                            content = `
                                <p>Contents of My Computer:</p>
                                <ul style="list-style-type:none; padding-left:5px;">
                                    <li><img src="https://win98icons.alexmeub.com/icons/png/drive_3_5-0.png" style="width:16px; vertical-align:middle;"> (A:) Floppy</li>
                                    <li><img src="https://win98icons.alexmeub.com/icons/png/drive_cd_rom-1.png" style="width:16px; vertical-align:middle;"> (C:) Local Disk</li>
                                    <li><img src="https://win98icons.alexmeub.com/icons/png/netdrive_world_2-0.png" style="width:16px; vertical-align:middle;"> Network</li>
                                </ul>`;
                        } else if (appId === "recycleBin") {
                             content = `<p>Recycle Bin is empty.</p><img src="https://win98icons.alexmeub.com/icons/png/recycle_bin_empty_cool-0.png" style="width:64px; display:block; margin:10px auto;">`;
                        }
                        createWindow(appId, appTitle, content);
                    }
                });
            });

            // Double click for desktop icons
            document.querySelectorAll('.desktop-icon').forEach(icon => {
                icon.addEventListener('dblclick', (e) => {
                     // The single click handler already handles opening,
                     // but dblclick is the more "classic" interaction for desktop icons.
                     // If we wanted dblclick ONLY, we'd need to manage click vs dblclick timers.
                     // For simplicity, we let the click handler do the work.
                     // This event listener is mostly for semantic correctness.
                });
            });


            // Pre-open a window for demo
            // createWindow("welcome", "Welcome!", "<p>Welcome to the Windows 9x JS Demo!</p><p>Try dragging this window, opening apps from the desktop or Start Menu.</p>");
        });
    </script>
</body>
</html>
