<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Windows 95 Demo</title>
  <style>
    body {
      margin: 0;
      background: #008080;
      font-family: 'MS Sans Serif', sans-serif;
    }

    #taskbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: #c0c0c0;
      border-top: 2px solid #fff;
      border-left: 2px solid #fff;
      border-right: 2px solid #808080;
      border-bottom: 2px solid #808080;
      display: flex;
      align-items: center;
      padding: 0 8px;
    }

    #start-button {
      background: #c0c0c0;
      border: 2px outset #fff;
      padding: 2px 10px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    #start-menu {
      position: fixed;
      bottom: 40px;
      left: 0;
      width: 200px;
      background: #c0c0c0;
      border: 2px outset #fff;
      display: none;
      z-index: 1000;
    }

    .window {
      position: absolute;
      top: 100px;
      left: 100px;
      width: 300px;
      background: #c0c0c0;
      border: 2px solid #000;
      z-index: 999;
    }

    .title-bar {
      background: #000080;
      color: white;
      padding: 2px 6px;
      cursor: move;
      font-weight: bold;
    }

    .content {
      padding: 10px;
      background: white;
    }
  </style>
</head>
<body>
  <div id="taskbar">
    <div id="start-button">Start</div>
  </div>

  <div id="start-menu">
    <div>Programs</div>
    <div>Settings</div>
    <div>Shut Down...</div>
  </div>

  <div class="window" id="demo-window">
    <div class="title-bar" id="title-bar">My Computer</div>
    <div class="content">
      Hello from Windows 95!
    </div>
  </div>

  <script>
    const startBtn = document.getElementById('start-button');
    const startMenu = document.getElementById('start-menu');

    startBtn.addEventListener('click', () => {
      startMenu.style.display = startMenu.style.display === 'block' ? 'none' : 'block';
    });

    // Dragging logic for window
    const win = document.getElementById('demo-window');
    const bar = document.getElementById('title-bar');
    let isDragging = false;
    let offsetX = 0;
    let offsetY = 0;

    bar.addEventListener('mousedown', (e) => {
      isDragging = true;
      offsetX = e.clientX - win.offsetLeft;
      offsetY = e.clientY - win.offsetTop;
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
    });

    document.addEventListener('mousemove', (e) => {
      if (isDragging) {
        win.style.left = (e.clientX - offsetX) + 'px';
        win.style.top = (e.clientY - offsetY) + 'px';
      }
    });
  </script>
</body>
</html>
