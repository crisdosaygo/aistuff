<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 98½</title>
    <link rel=icon href="https://win98icons.alexmeub.com/icons/png/internet_connection_wiz-0.png">
    <style>
        body {
            background-color: #008080; /* Classic Teal */
            font-family: "MS Sans Serif", "Tahoma", Arial, sans-serif;
            font-size: 12px;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        .desktop {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 30px; /* Space for taskbar */
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: flex-start; /* Align icons to the left */
        }
        /* Add :focus style for desktop for visual feedback when it has keyboard focus */
        .desktop:focus {
            /* Example: subtle border to show it's the active container */
            /* outline: 1px dashed rgba(255, 255, 255, 0.3); */
            /* outline-offset: -1px; */
            /* Script handles .keyboard-focused on items, this is for the container itself */
        }


        .desktop-icon {
            width: 75px;
            margin: 10px;
            text-align: center;
            color: white;
            cursor: pointer;
            padding: 5px;
            /* Ensure icons don't get a default browser outline if script handles focus */
        }
        .desktop-icon:focus { 
            outline: none;
        }

        .desktop-icon:hover {
            background-color: rgba(0, 0, 128, 0.5); /* Dark blue transparent */
            outline: 1px dotted white;
        }
        .desktop-icon img {
            width: 32px;
            height: 32px;
            display: block;
            margin: 0 auto 5px auto;
        }
        .desktop-icon.selected {
            background-color: rgba(0, 0, 128, 0.7); /* Darker selection */
            outline: 1px dotted white;
        }
        .desktop-icon.selected span {
            background-color: #000080; /* Opaque background for text */
            color: white; /* Ensure text is visible */
            padding: 1px 2px;
        }


        .taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30px;
            background-color: #c0c0c0; /* Classic Gray */
            border-top: 2px solid #ffffff;
            display: flex;
            align-items: center;
            padding: 0 5px;
            z-index: 10000; /* Always on top */
        }

        .start-button {
            background-color: #c0c0c0;
            border: 2px outset #dfdfdf;
            padding: 2px 10px;
            margin-right: 5px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .start-button:active {
            border-style: inset;
        }
        .start-button img {
            width: 16px;
            height: 16px;
            margin-right: 5px;
        }
        .start-button:focus { /* Style for when start button itself has focus */
            outline: 1px dotted black;
            outline-offset: -2px;
        }


        .start-menu {
            position: absolute;
            bottom: 30px; /* Above taskbar */
            left: 0;
            /* width: 200px; /* Slightly wider for icons (now auto) */
            background-color: #c0c0c0;
            border: 2px outset #dfdfdf;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            /* padding: 2px; (now handled by items-container) */
            display: none; /* Hidden by default */
            z-index: 9999;
            flex-direction: row; /* Changed for sidebar layout */
            width: auto; 
        }
        .start-menu:focus { /* Style for when start menu container has focus */
            /* outline: 1px dotted blue; */ /* Example */
            outline: none; /* Script manages item focus visuals */
        }

        .start-menu-item {
            padding: 5px 10px 5px 5px; /* Adjusted padding */
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
        }
        .start-menu-item:hover {
            background-color: #000080; /* Dark Blue */
            color: white;
        }
        .start-menu-item:focus { /* Remove default outline if script handles visual focus */
            outline: none;
        }
        .start-menu-icon {
            width: 20px; /* Slightly larger for start menu */
            height: 20px;
            margin-right: 8px;
            vertical-align: middle;
        }
        .start-menu-separator {
            height: 1px;
            background-color: #808080;
            margin: 2px 0;
            border-bottom: 1px solid #ffffff;
        }
        .start-menu-item.disabled {
            color: #808080;
            cursor: default;
        }
        .start-menu-item.disabled:hover {
            background-color: #c0c0c0;
            color: #808080;
        }


        .start-menu-sidebar {
            background-color: #000080; /* Dark Blue */
            color: white;
            padding: 10px 5px;
            writing-mode: vertical-lr; /* Rotate text */
            text-orientation: mixed;
            transform: rotate(180deg); /* Correct orientation after vertical-rl */
            font-weight: bold;
            font-size: 16px; /* Adjust as needed */
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 2px outset #dfdfdf; /* 3D effect */
            min-width: 25px; /* Ensure it has some width */
        }
        .start-menu-sidebar .and-half {
          display: inline-block;
          transform:rotate(90deg);
        }
        .start-menu-sidebar-text {
            white-space: nowrap; /* Prevent text from wrapping */
        }

        .start-menu-items-container {
            background-color: #c0c0c0; /* Original start menu background */
            padding: 2px; /* Original start menu padding */
            width: 180px; /* Original width of items area, adjust if needed */
            display: flex;
            flex-direction: column;
        }

        .taskbar-windows {
            display: flex;
            flex-grow: 1;
            margin: 0 5px;
            overflow: hidden;
        }
        .taskbar-button {
            background-color: #c0c0c0;
            border: 2px outset #dfdfdf;
            padding: 1px 5px; /* Adjusted padding */
            margin-right: 3px;
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
            cursor: pointer;
            display: flex;
            align-items: center;
            height: 22px; /* Consistent height */
            box-sizing: border-box;
        }
        .taskbar-button:focus { /* Style for focused taskbar buttons */
            outline: 1px dotted black;
            outline-offset: -2px;
        }
        .taskbar-button.active {
            border-style: inset;
            font-weight: bold;
        }
        .taskbar-button img {
            width: 16px;
            height: 16px;
            margin-right: 4px;
            vertical-align: middle;
        }
        .taskbar-button.minimized {
            opacity: 0.9; /* Slightly different look for minimized */
        }


        .clock {
            border: 1px inset #808080;
            padding: 3px 8px;
            margin-left: auto; /* Pushes to the right */
            font-size: 11px;
            min-width: 60px;
            text-align: center;
            height: 20px; /* Consistent height */
            line-height: 12px; 
            box-sizing: border-box;
        }

        /* Window Styling */
        .window {
            position: absolute;
            background-color: #c0c0c0;
            border: 2px outset #dfdfdf;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            min-width: 200px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            overflow: hidden; 
        }
        .window:focus, .window:focus-within { /* Indicate active window subtly */
             /* border-color: #666; */ /* Example: darker border for focused window */
             /* The .inactive class handles visual distinction well, so direct focus style might be redundant */
        }


        .window-titlebar {
            background-color: #000080; /* Dark Blue */
            color: white;
            padding: 3px 5px;
            font-weight: bold;
            cursor: grab;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 20px; 
            box-sizing: border-box;
        }
        .window-titlebar:active {
            cursor: grabbing;
        }
        .window-titlebar-icon {
            margin-right: 5px;
            vertical-align: middle; 
            width: 16px;
            height: 16px;
        }
        .window-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1; 
        }
        .window.inactive .window-titlebar {
            background-color: #808080; 
        }
        .window.inactive .window-titlebar-icon {
            opacity: 0.7; 
        }
        .window.inactive .window-title {
            color: #D3D3D3; 
        }


        .window-controls button {
            background-color: #c0c0c0;
            border: 1px outset #dfdfdf;
            color: black;
            font-family: "Marlett", "Webdings"; 
            font-size: 10px; 
            width: 16px;
            height: 14px;
            line-height: 10px; 
            padding: 0;
            margin-left: 2px;
            cursor: pointer;
        }
        .window-controls button:active {
            border-style: inset;
        }
        .window-controls button:focus { /* Style for focused window control buttons */
            outline: 1px dotted black;
            outline-offset: -1px;
        }


        .window-content {
            padding: 0; 
            background-color: #ffffff; 
            flex-grow: 1;
            margin: 3px;
            border: 1px inset #808080;
            overflow: auto; 
            display: flex; 
            flex-direction: column; 
        }
        .window-content:focus { /* Style for when content area itself gets focus */
             /* outline: 1px solid blue; */ /* Example, if needed */
        }


        .window.maximized .window-titlebar {
            cursor: default; 
        }

        .win95-button {
            background-color: #c0c0c0;
            border: 2px outset #dfdfdf;
            padding: 5px 15px;
            margin: 0 5px;
            min-width: 70px;
            cursor: pointer;
        }
        .win95-button:active {
            border-style: inset;
        }
        .win95-button:focus { /* Style for focused dialog buttons */
            outline: 1px dotted black;
            outline-offset: -2px;
        }


        .resize-handle {
            position: absolute;
        }
        .resize-handle-n { top: -3px; left: 5px; right: 5px; height: 6px; cursor: n-resize; }
        .resize-handle-ne { top: -3px; right: -3px; width: 6px; height: 6px; cursor: ne-resize; }
        .resize-handle-e { top: 5px; bottom: 5px; right: -3px; width: 6px; cursor: e-resize; }
        .resize-handle-se { bottom: -3px; right: -3px; width: 6px; height: 6px; cursor: se-resize; }
        .resize-handle-s { bottom: -3px; left: 5px; right: 5px; height: 6px; cursor: s-resize; }
        .resize-handle-sw { bottom: -3px; left: -3px; width: 6px; height: 6px; cursor: sw-resize; }
        .resize-handle-w { top: 5px; bottom: 5px; left: -3px; width: 6px; cursor: w-resize; }
        .resize-handle-nw { top: -3px; left: -3px; width: 6px; height: 6px; cursor: nw-resize; }

        .window.maximized .resize-handle {
            display: none;
        }

        /* ===== BROWSER UI STYLES ===== */
        .browser-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            background-color: #c0c0c0; 
        }

        .browser-toolbar, .browser-address-toolbar {
            padding: 3px;
            border-bottom: 1px solid #808080;
            display: flex;
            align-items: center;
            flex-shrink: 0; 
        }
        .browser-toolbar button, .browser-address-toolbar button {
            background-color: #c0c0c0;
            border: 1px outset #dfdfdf;
            padding: 3px 6px;
            margin-right: 3px;
            font-size: 11px; 
            min-width: 50px; 
        }
        .browser-toolbar button:active, .browser-address-toolbar button:active {
            border-style: inset;
        }
        .browser-toolbar button:disabled {
            color: #808080;
            border-color: #808080;
            cursor: default;
        }
        .browser-toolbar button:focus, .browser-address-toolbar button:focus { /* Focus style for browser buttons */
            outline: 1px dotted black;
            outline-offset: -2px;
        }


        .browser-address-toolbar label {
            margin-right: 5px;
            font-weight: bold;
        }
        .browser-address-bar {
            flex-grow: 1;
            margin-right: 3px;
            padding: 3px;
            border: 1px inset #808080;
            font-size: 12px;
            height: 20px;
            box-sizing: border-box;
        }
        .browser-address-bar:focus { /* Focus style for address bar */
            outline: 1px dotted blue; 
            outline-offset: -1px;
        }


        .browser-tab-bar {
            display: flex;
            background-color: #c0c0c0;
            padding: 2px 2px 0 2px; 
            border-bottom: 1px solid #808080;
            flex-shrink: 0;
            align-items: flex-end; 
        }
        .browser-tab {
            background-color: #a0a0a0; 
            border: 1px outset #dfdfdf;
            border-bottom: none; 
            padding: 4px 8px;
            margin-right: -1px; 
            font-size: 11px;
            cursor: pointer;
            position: relative;
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-top-left-radius: 3px;
            border-top-right-radius: 3px;
        }
        .browser-tab:focus { /* Remove default outline if script handles visual focus */
            outline: none;
        }

        .browser-tab.active {
            background-color: #e0e0e0; 
            z-index: 1; 
            padding-bottom: 5px; 
            margin-bottom: -1px; 
            font-weight: bold;
        }
        .browser-tab .tab-close-btn {
            margin-left: 8px;
            font-size: 10px;
            color: #404040;
            cursor: pointer;
            padding: 0 2px;
            border-radius: 2px;
        }
        .browser-tab .tab-close-btn:hover {
            background-color: #ff6060;
            color: white;
        }
        .browser-new-tab-btn {
            background-color: #c0c0c0;
            border: 1px outset #dfdfdf;
            padding: 2px 6px;
            margin-left: 3px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            height: 20px; 
            align-self: center; 
        }
        .browser-new-tab-btn:active {
            border-style: inset;
        }
        .browser-new-tab-btn:focus { /* Focus style for new tab button */
            outline: 1px dotted black;
            outline-offset: -2px;
        }


        browser-webview {
            flex-grow: 1;
            background-color: white; 
            border: 1px solid #000; 
            margin: 2px; 
            display: flex; 
            align-items: center;
            justify-content: center;
            font-style: italic;
            color: #666;
        }


        .browser-toolbar {
            padding: 3px;
            border-bottom: 1px solid #808080;
            display: flex;
            align-items: center;
            justify-content: space-between; 
            flex-shrink: 0;
        }

        .browser-nav-buttons { 
            display: flex;
            align-items: center;
        }

        .browser-throbber {
            width: 28px;  
            height: 28px; 
            margin-left: auto; 
            margin-right: 5px; 
        }
    </style>
</head>
<body>
    <div class="desktop" id="desktop" tabindex="0"> <!-- MODIFIED -->
        <div class="desktop-icon" data-app-id="myComputer">
            <img src="https://win98icons.alexmeub.com/icons/png/computer_explorer-0.png" alt="My Computer">
            <span>My Computer</span>
        </div>
        <div class="desktop-icon" data-app-id="notepad">
            <img src="https://win98icons.alexmeub.com/icons/png/notepad-0.png" alt="Notepad">
            <span>Notepad</span>
        </div>
        <div class="desktop-icon" data-app-id="recycleBin">
            <img src="https://win98icons.alexmeub.com/icons/png/recycle_bin_empty-0.png" alt="Recycle Bin">
            <span>Recycle Bin</span>
        </div>
        <div class="desktop-icon" data-app-id="calculator">
            <img src="https://win98icons.alexmeub.com/icons/png/calculator-0.png" alt="Calculator">
            <span>Calculator</span>
        </div>

        <div class="desktop-icon" data-app-id="internetBrowser">
            <img 
              src="https://win98icons.alexmeub.com/icons/png/search_web-0.png" 
              alt="Internet Browser">
            <span>Internet Browser</span>
        </div>

        <div class="desktop-icon" data-app-id="internetExplorer">
            <img 
              src="https://win98icons.alexmeub.com/icons/png/msie2-0.png" 
              alt="Internet Explorer">
            <span>Internet Explorer</span>
        </div>

        <div class="desktop-icon" data-app-id="netscapeNavigator">
            <img 
              src="./n2-2.png" 
              alt="Netscape Navigator">
            <span>Netscape Navigator</span>
        </div>
    </div>

    <div class="start-menu" id="startMenu" tabindex="-1"> <!-- MODIFIED -->
        <div class="start-menu-sidebar">
            <span class="start-menu-sidebar-text">Windows 98<span class="and-half">½</span></span> <!-- Used   for non-breaking space -->
        </div>
        <div class="start-menu-items-container"> 
            <div class="start-menu-item" data-app-id="notepad">
                <img src="https://win98icons.alexmeub.com/icons/png/notepad-0.png" class="start-menu-icon" alt=""> Notepad
            </div>
            <div class="start-menu-item" data-app-id="calculator">
                <img src="https://win98icons.alexmeub.com/icons/png/calculator-0.png" class="start-menu-icon" alt=""> Calculator
            </div>
            <div class="start-menu-item" data-app-id="myComputer">
                <img src="https://win98icons.alexmeub.com/icons/png/computer_explorer-0.png" class="start-menu-icon" alt=""> My Computer
            </div>
            <div class="start-menu-item" data-app-id="internetBrowser">
                <img src="https://win98icons.alexmeub.com/icons/png/search_web-0.png" class="start-menu-icon" alt=""> Internet Browser
            </div>
            <div class="start-menu-item" data-app-id="internetExplorer">
                <img src="https://win98icons.alexmeub.com/icons/png/msie2-0.png" class="start-menu-icon" alt=""> Internet Explorer <!-- Corrected text -->
            </div>
            <div class="start-menu-item" data-app-id="netscapeNavigator">
                <img src="./n2-2.png" class="start-menu-icon" alt=""> Netscape Navigator <!-- Corrected text -->
            </div>
            <div class="start-menu-separator"></div>
            <div class="start-menu-item disabled">
                <img src="https://win98icons.alexmeub.com/icons/png/settings_gear-0.png" class="start-menu-icon" alt=""> Settings
            </div>
            <div class="start-menu-item disabled">
                <img src="https://win98icons.alexmeub.com/icons/png/help_book_cool-0.png" class="start-menu-icon" alt=""> Help
            </div>
            <div class="start-menu-separator"></div>
            <div class="start-menu-item" id="shutdownButtonTrigger">
                <img src="https://win98icons.alexmeub.com/icons/png/shut_down_cool-0.png" class="start-menu-icon" alt=""> Shut Down...
            </div>
        </div>
    </div>
    <div class="taskbar">
        <button class="start-button" id="startButton" tabindex="0"> <!-- MODIFIED -->
            <img src="https://win98icons.alexmeub.com/icons/png/windows-0.png" alt="Start">
            Start
        </button>
        <div class="taskbar-windows" id="taskbarWindows">
            <!-- Taskbar buttons for open windows go here -->
        </div>
        <div class="clock" id="clock"></div>
    </div>

    <template id="windowTemplate">
        <div class="window" tabindex="-1"> <!-- MODIFIED -->
            <div class="window-titlebar">
                <img class="window-titlebar-icon" src="" alt="" width="16" height="16">
                <span class="window-title">Window</span>
                <div class="window-controls">
                    <button class="window-minimize-btn" title="Minimize" tabindex="-1">0</button> <!-- Make controls not directly tabbable -->
                    <button class="window-maximize-btn" title="Maximize" tabindex="-1">1</button>
                    <button class="window-close-btn" title="Close" tabindex="-1">r</button>
                </div>
            </div>
            <div class="window-content">
                <!-- Content will be injected here -->
            </div>
            <!-- !!! RESIZE HANDLES !!! -->
            <div class="resize-handle resize-handle-n"></div>
            <div class="resize-handle resize-handle-ne"></div>
            <div class="resize-handle resize-handle-e"></div>
            <div class="resize-handle resize-handle-se"></div>
            <div class="resize-handle resize-handle-s"></div>
            <div class="resize-handle resize-handle-sw"></div>
            <div class="resize-handle resize-handle-w"></div>
            <div class="resize-handle resize-handle-nw"></div>
        </div>
    </template>
    <script type=module src=./app.js></script>
</body>
</html>
