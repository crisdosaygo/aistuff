        :root {

        .desktop {
            position: absolute;

            background-position: center;

        .desktop-icon img {

        .desktop-icon span {

        .taskbar {

        .start-button:active { border-style: inset; }
        .start-button img { width: 16px; height: 16px; margin-right: 5px; }
        .start-button:focus { outline: 1px dotted black; outline-offset: -2px; }
        .start-menu {

    <!-- Service Worker Control Script -->
    <script>
        // --- Service Worker Control ---
        // To disable SW: add ?sw=off to the URL
        // To enable SW (default): no param or ?sw=on
        const swControl = new URLSearchParams(window.location.search).get('sw') || 'on';
        const USE_SERVICE_WORKER = !(swControl === 'off'); // Enable by default

        async function unregisterAllServiceWorkersAndClearCaches() {
            if ('serviceWorker' in navigator) {
                try {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (const registration of registrations) {
                        await registration.unregister();
                        console.log('ServiceWorker unregistered:', registration.scope);
                    }
                } catch (error) {
                    console.error('Error unregistering ServiceWorker:', error);
                }
            }
            if ('caches' in window) {
                try {
                    const cacheNames = await caches.keys();
                    for (const cacheName of cacheNames) {
                        await caches.delete(cacheName);
                        console.log('Cache deleted:', cacheName);
                    }
                    console.log('All caches cleared.');
                } catch (error) {
                    console.error('Error clearing caches:', error);
                }
            }
            // Consider a reload if you want the page to immediately reflect the no-SW state.
            // However, this might interrupt the user if they are actively doing something.
            // For development, a manual refresh after ?sw=off is often sufficient.
            // if (swControl === 'off') { // Only reload if explicitly turned off
            //     console.log('Reloading page to apply no-SW state.');
            //     window.location.reload();
            // }
        }

        if ('serviceWorker' in navigator) {
            if (USE_SERVICE_WORKER) {
                window.addEventListener('load', () => { // Register SW on window load
                    navigator.serviceWorker.register('./sw.js') // Ensure sw.js is at the root
                        .then(registration => {
                            console.log('ServiceWorker registration successful with scope: ', registration.scope);
                        })
                        .catch(error => {
                            console.log('ServiceWorker registration failed: ', error);
                        });
                });
            } else {
                console.log('Service Worker is disabled by flag. Unregistering existing SWs and clearing caches.');
                // Call this function early, before 'load', to try and prevent an existing SW from controlling the page.
                unregisterAllServiceWorkersAndClearCaches();
            }
        }
    </script>
    <!-- End Service Worker Control Script -->

    <!-- Splash Screen Script (adapted from your splash.html) -->
    <script>
        (function() {
            const progressBarFill8bit = document.getElementById('splash-progress-8bit-fill');
            const statusText8bit = document.querySelector('.splash-status-text-8bit');
            const splashScreenElement = document.getElementById('splash-screen-8bit');
            let currentProgress8bit = 0;
            let hideTimeoutId = null;

            function _updateProgressBar(percentage) {
                currentProgress8bit = Math.min(100, Math.max(0, Math.round(percentage)));
                if (progressBarFill8bit) progressBarFill8bit.style.width = currentProgress8bit + '%';
                const debugValueDisplay = document.getElementById('debug-progress-value');
                if (debugValueDisplay) debugValueDisplay.textContent = currentProgress8bit;
            }
            function _setSplashStatusText(statusKey) {
                if (statusText8bit) {
                    if (statusKey === "ready") {
                        statusText8bit.textContent = "READY";
                        statusText8bit.style.animation = 'none';
                        statusText8bit.style.visibility = 'visible';
                    } else {
                        statusText8bit.textContent = "Loading";
                        statusText8bit.style.animation = 'blink-text 1.2s infinite steps(1, end)';
                    }
                }
            }
            function _executeHideSplashAnimation() {
                if (splashScreenElement) {
                    splashScreenElement.style.opacity = '0';
                    setTimeout(() => {
                        splashScreenElement.style.display = 'none';
                        const desktopEl = document.getElementById('desktop');
                        if(desktopEl) desktopEl.style.visibility = 'visible';
                    }, 200);
                }
            }
            window.SPLASH_API = {
                setProgress: function(percentage) {
                    clearTimeout(hideTimeoutId); hideTimeoutId = null;
                    _updateProgressBar(percentage);
                    if (percentage < 100) _setSplashStatusText("loading");
                    else _setSplashStatusText("ready");
                },
                completeAndHide: function() {
                    clearTimeout(hideTimeoutId);
                    _updateProgressBar(100);
                    _setSplashStatusText("ready");
                    hideTimeoutId = setTimeout(_executeHideSplashAnimation, 600);
                },
                showDebugControls: function() {
                    const debugControls = document.getElementById('debug-controls');
                    if (debugControls) debugControls.style.display = 'block';
                }
            };
            const debugSlider = document.getElementById('debug-splash-slider');
            if (debugSlider) {
                debugSlider.addEventListener('input', function() {
                    const value = parseInt(this.value, 10);
                    if (value >= 100) window.SPLASH_API.completeAndHide();
                    else window.SPLASH_API.setProgress(value);
                });
            }
            _updateProgressBar(0); _setSplashStatusText("loading");
        })();
    </script>
