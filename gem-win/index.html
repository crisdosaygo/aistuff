<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 98½</title>
    <link rel=icon href="./internet_connection_wiz-0.png">
    <style>
        @font-face {
            font-family: 'MarlettCustom'; /* Name your custom font */
            src: url('./marlett.woff') format('woff'); /* Provide the correct path to your font file */
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --desktop-bg-color: #008080;
            --theme-color-active-titlebar: #000080;
            --theme-color-inactive-titlebar: #808080;
            --desktop-icon-text-color: white;
            --network-explorer-menu-bar-bg: #F0E68C;
        }

        body {
            background-color: var(--desktop-bg-color);
            font-family: "MS Sans Serif", "Tahoma", Arial, sans-serif;
            font-size: 12px;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        .desktop {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 30px;
            padding: 10px; /* This padding is visual, snap-to-grid adds its own internal padding */
            background-size: cover; /* For background image from display properties */
            background-position: center; /* For background image */
        }
        .desktop:focus {
            /* outline: 1px dashed rgba(255, 255, 255, 0.3); */
        }

        .desktop-icon {
            width: 75px;
            text-align: center;
            color: var(--desktop-icon-text-color);
            cursor: default;
            padding: 5px;
            /* position: absolute; /* Will be set by JS */
            /* margin: 0; /* Will be set by JS */
        }
        .desktop-icon:focus {
            outline: none;
        }

        .desktop-icon img {
            width: 32px;
            height: 32px;
            display: block;
            margin: 0 auto 5px auto;
        }
        .desktop-icon span {
          display: inline-block;
          max-width: 75px;
          width: min-content;
        }
        .desktop-icon.selected span {
            background-color: var(--theme-color-active-titlebar); /* Use theme color for selection */
            color: white;
            border: 1px dotted var(--desktop-icon-text-color); /* Dotted border with icon text color */
            padding: 1px 2px;
        }

        .taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30px;
            background-color: #c0c0c0;
            border-top: 2px solid #ffffff;
            display: flex;
            align-items: center;
            padding: 0 5px;
            z-index: 10000;
        }

        .start-button {
            background-color: #c0c0c0;
            border: 2px outset #dfdfdf;
            padding: 2px 10px;
            margin-right: 5px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .start-button:active {
            border-style: inset;
        }
        .start-button img {
            width: 16px;
            height: 16px;
            margin-right: 5px;
        }
        .start-button:focus {
            outline: 1px dotted black;
            outline-offset: -2px;
        }

        .start-menu {
            position: absolute;
            bottom: 30px;
            left: 0;
            background-color: #c0c0c0;
            border: 2px outset #dfdfdf;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            display: none;
            z-index: 9999;
            flex-direction: row;
            width: auto;
        }
        .start-menu:focus {
            outline: none;
        }

        .start-menu-item {
            padding: 5px 10px 5px 5px;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
        }
        .start-menu-item:hover {
            background-color: var(--theme-color-active-titlebar);
            color: white;
        }
        .start-menu-item:focus {
            outline: none;
        }
        .start-menu-icon {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            vertical-align: middle;
        }
        .start-menu-separator {
            height: 1px;
            background-color: #808080;
            margin: 2px 0;
            border-bottom: 1px solid #ffffff;
        }
        .start-menu-item.disabled {
            color: #808080;
            cursor: default;
        }
        .start-menu-item.disabled:hover {
            background-color: #c0c0c0;
            color: #808080;
        }

        .start-menu-sidebar {
            background: linear-gradient(0deg, var(--theme-color-active-titlebar) 62%, dodgerblue, var(--theme-color-active-titlebar));
            color: white;
            padding: 10px 5px;
            writing-mode: vertical-lr;
            text-orientation: mixed;
            transform: rotate(180deg);
            font-weight: bold;
            font-size: 16px;
            align-items: center;
            justify-content: center;
            border-right: 2px outset #dfdfdf;
            padding-inline-start: 5ex;
        }
        .start-menu-sidebar .and-half {
          display: inline-block;
          transform:rotate(90deg);
        }
        .start-menu-sidebar-text {
            white-space: nowrap;
        }

        .start-menu-items-container {
            background-color: #c0c0c0;
            padding: 2px;
            width: 180px;
            display: flex;
            flex-direction: column;
        }

        .taskbar-windows {
            display: flex;
            flex-grow: 1;
            margin: 0 5px;
            overflow: hidden;
        }
        .taskbar-button {
            background-color: #c0c0c0;
            border: 2px outset #dfdfdf;
            padding: 1px 5px;
            margin-right: 3px;
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
            cursor: pointer;
            display: flex;
            align-items: center;
            height: 22px;
            box-sizing: border-box;
        }
        .taskbar-button:focus {
            outline: 1px dotted black;
            outline-offset: -2px;
        }
        .taskbar-button.active {
            border-style: inset;
            font-weight: bold;
        }
        .taskbar-button img {
            width: 16px;
            height: 16px;
            margin-right: 4px;
            vertical-align: middle;
        }
        .taskbar-button.minimized {
            opacity: 0.9;
        }

        .clock {
            border: 1px inset #808080;
            padding: 3px 8px;
            margin-left: auto;
            font-size: 11px;
            min-width: 60px;
            text-align: center;
            height: 20px;
            line-height: 12px;
            box-sizing: border-box;
        }

        .window {
            position: absolute;
            background-color: #c0c0c0;
            border: 2px outset #dfdfdf;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            min-width: 200px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
        }

        .window-titlebar {
            background-color: var(--theme-color-active-titlebar);
            color: white;
            padding: 3px 5px;
            font-weight: bold;
            cursor: grab;
            display: flex;
            justify-content: space-between;
            align-items: center;
            touch-action: none;
            height: 20px;
            box-sizing: border-box;
        }
        .window-titlebar:active {
            cursor: grabbing;
        }
        .window-titlebar-icon {
            margin-right: 5px;
            vertical-align: middle;
            width: 16px;
            height: 16px;
        }
        .window-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
        }
        .window.inactive .window-titlebar {
            background-color: var(--theme-color-inactive-titlebar);
        }
        .window.inactive .window-titlebar-icon {
            opacity: 0.7;
        }
        .window.inactive .window-title {
            color: #D3D3D3;
        }

        .window-controls button {
            background-color: #c0c0c0;
            border: 1px outset #dfdfdf; /* Adjusted from 2px to 1px for typical Win9x look */
            color: black;
            font-family: "MarlettCustom", "Marlett", "Webdings", sans-serif; /* Using self-hosted Marlett */
            font-size: 10px; /* Marlett glyphs are typically small */
            width: 16px;
            height: 14px;
            line-height: 14px; /* Adjusted to height */
            padding: 0;
            margin-left: 2px;
            cursor: pointer;
            /* display: inline-flex; align-items: center; justify-content: center; /* Not always needed for Marlett */
        }
        .window-controls button:active {
            border-style: inset;
        }
        .window-controls button:focus {
            outline: 1px dotted black;
            outline-offset: -1px;
        }
        .window-controls {
          min-width: fit-content;
        }

        .window-content {
            padding: 0;
            background-color: #ffffff;
            flex-grow: 1;
            margin: 3px;
            border: 1px inset #808080;
            overflow: auto;
            display: flex;
            flex-direction: column;
        }

        .window.maximized .window-titlebar {
            cursor: default;
        }

        .win95-button {
            background-color: #c0c0c0;
            border: 2px outset #dfdfdf;
            padding: 5px 15px;
            margin: 0 5px;
            min-width: 70px;
            cursor: pointer;
        }
        .win95-button:active {
            border-style: inset;
        }
        .win95-button:focus {
            outline: 1px dotted black;
            outline-offset: -2px;
        }

        .resize-handle { position: absolute;     touch-action: none; /* Prevent default pan/zoom on resize handles */ }
        .resize-handle-n  { z-index: 1000000; top: -12px; left: 12px; right: 12px; height: 16px; cursor: n-resize; }
        .resize-handle-ne { z-index: 1000000; top: -12px; right: -12px; width: 16px; height: 16px; cursor: ne-resize; }
        .resize-handle-e  { z-index: 1000000; top: 12px; bottom: 12px; right: -12px; width: 16px; cursor: e-resize; }
        .resize-handle-se { z-index: 1000000; bottom: -12px; right: -12px; width: 16px; height: 16px; cursor: se-resize; }
        .resize-handle-s  { z-index: 1000000; bottom: -12px; left: 12px; right: 12px; height: 16px; cursor: s-resize; }
        .resize-handle-sw { z-index: 1000000; bottom: -12px; left: -12px; width: 16px; height: 16px; cursor: sw-resize; }
        .resize-handle-w  { z-index: 1000000; top: 12px; bottom: 12px; left: -12px; width: 16px; cursor: w-resize; }
        .resize-handle-nw { z-index: 1000000; top: -12px; left: -12px; width: 16px; height: 16px; cursor: nw-resize; }
        .window.maximized .resize-handle { display: none; }

        @media screen and (max-width: 600px) {
          .resize-handle-n  { top: -28px; left: 28px; right: 28px; height: 32px; }
          .resize-handle-ne { top: -28px; right: -28px; width: 32px; height: 32px; }
          .resize-handle-e  { top: 28px; bottom: 28px; right: -28px; width: 32px; }
          .resize-handle-se { bottom: -28px; right: -28px; width: 32px; height: 32px; }
          .resize-handle-s  { bottom: -28px; left: 28px; right: 28px; height: 32px; }
          .resize-handle-sw { bottom: -28px; left: -28px; width: 32px; height: 32px; }
          .resize-handle-w  { top: 28px; bottom: 28px; left: -28px; width: 32px; }
          .resize-handle-nw { top: -28px; left: -28px; width: 32px; height: 32px; }
        }
        .no-select { user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; }

        .marquee-select-box {
            position: absolute;
            border: 1px dotted var(--theme-color-active-titlebar);
            background-color: rgba(0, 0, 128, 0.2); /* Consider a variable if theme changes drastically */
            z-index: 1000;
        }
    </style>
    <link rel=stylesheet href=desktop-icons.css> <!-- Contains .desktop-icon specific styles if any beyond above -->
    <link rel="stylesheet" href="desktop-context-menu.css">
    <link rel="stylesheet" href="browser.css"> <!-- For browser specific styles like tab 'x' -->
</head>
<body>
    <div class="desktop" id="desktop" tabindex="0">
        <div class="desktop-icon" data-app-id="networkExplorer">
            <img src="./network_normal_two_pcs-0.png" alt="Network Neighborhood">
            <span>Network Neighborhood</span>
        </div>
        <div class="desktop-icon" data-app-id="notepad">
            <img src="./notepad-0.png" alt="Notepad">
            <span>Notepad</span>
        </div>
        <div class="desktop-icon" data-app-id="recycleBin">
            <img src="./recycle_bin_empty-0.png" alt="Recycle Bin">
            <span>Recycle Bin</span>
        </div>
        <div class="desktop-icon" data-app-id="calculator">
            <img src="./calculator-0.png" alt="Calculator">
            <span>Calculator</span>
        </div>
        <div class="desktop-icon" data-app-id="internetBrowser">
            <img src="./search_web-0.png" alt="Internet Browser">
            <span>Internet Browser</span>
        </div>
        <div class="desktop-icon" data-app-id="internetExplorer">
            <img src="./msie2-0.png" alt="Internet Explorer">
            <span>Internet Explorer</span>
        </div>
        <div class="desktop-icon" data-app-id="netscapeNavigator">
            <img src="./n2-2.png" alt="Netscape Navigator">
            <span>Netscape Navigator</span>
        </div>
    </div>

    <div class="start-menu" id="startMenu" tabindex="-1">
        <div class="start-menu-sidebar">
            <span class="start-menu-sidebar-text">Windows&nbsp;98<span class="and-half">½</span></span>
        </div>
        <div class="start-menu-items-container">
            <div class="start-menu-item" data-app-id="networkExplorer"><img src="./network_normal_two_pcs-0.png" class="start-menu-icon" alt=""> Network Neighborhood</div>
            <div class="start-menu-item" data-app-id="notepad"><img src="./notepad-0.png" class="start-menu-icon" alt=""> Notepad</div>
            <div class="start-menu-item" data-app-id="calculator"><img src="./calculator-0.png" class="start-menu-icon" alt=""> Calculator</div>
            <div class="start-menu-item" data-app-id="internetBrowser"><img src="./search_web-0.png" class="start-menu-icon" alt=""> Internet Browser</div>
            <div class="start-menu-item" data-app-id="internetExplorer"><img src="./msie2-0.png" class="start-menu-icon" alt=""> Internet Explorer</div>
            <div class="start-menu-item" data-app-id="netscapeNavigator"><img src="./n2-2.png" class="start-menu-icon" alt=""> Netscape Navigator</div>
            <div class="start-menu-separator"></div>
            <div class="start-menu-item disabled"><img src="./settings_gear-0.png" class="start-menu-icon" alt=""> Settings</div>
            <div class="start-menu-item disabled"><img src="./help_book_cool-0.png" class="start-menu-icon" alt=""> Help</div>
            <div class="start-menu-separator"></div>
            <div class="start-menu-item" id="shutdownButtonTrigger"><img src="./shut_down_cool-0.png" class="start-menu-icon" alt=""> Shut Down...</div>
        </div>
    </div>
    <div class="taskbar">
        <button class="start-button" id="startButton" tabindex="0">
            <img src="./windows-0.png" alt="Start">
            Start
        </button>
        <div class="taskbar-windows" id="taskbarWindows"></div>
        <div class="clock" id="clock"></div>
    </div>

    <template id="windowTemplate">
        <div class="window" tabindex="-1">
            <div class="window-titlebar">
                <img class="window-titlebar-icon" src="" alt="" width="16" height="16">
                <span class="window-title">Window</span>
                <div class="window-controls">
                    <button class="window-minimize-btn" title="Minimize" tabindex="-1">0</button> <!-- Marlett: Minimize -->
                    <button class="window-maximize-btn" title="Maximize" tabindex="-1">1</button> <!-- Marlett: Maximize -->
                    <button class="window-close-btn" title="Close" tabindex="-1">r</button>   <!-- Marlett: Close -->
                </div>
            </div>
            <div class="window-content"></div>
            <div class="resize-handle resize-handle-n"></div>
            <div class="resize-handle resize-handle-ne"></div>
            <div class="resize-handle resize-handle-e"></div>
            <div class="resize-handle resize-handle-se"></div>
            <div class="resize-handle resize-handle-s"></div>
            <div class="resize-handle resize-handle-sw"></div>
            <div class="resize-handle resize-handle-w"></div>
            <div class="resize-handle resize-handle-nw"></div>
        </div>
    </template>
    <script type=module src=./app.js></script>
    <script src=./icon-selection-effect.js></script>
    <script src=./snap-to-grid.js></script> <!-- snap-to-grid before desktop-icons -->
    <script src=./desktop-icons.js></script>
    <script src=./desktop-context-menu.js></script>
</body>
</html>
