<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOSAYGO OS Loading...</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
            color: #FFFFFF;
            font-family: 'Press Start 2P', cursive, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: pixelated;
            font-smooth: never;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: grayscale;
        }

        #splash-screen-8bit {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.2s linear;
        }

        .splash-logo-container-8bit {
            margin-bottom: 35px;
        }

        .dosaygo-logo-svg-8bit {
            /* viewBox is "14 0 72 108" (width 72, height 108) */
            /* Aspect ratio 72:108 = 2:3 */
            width: 96px;   /* If width is 96px (72 * 1.333) */
            height: 144px; /* Then height is 108 * 1.333 = 144px */
        }

        .dosaygo-logo-svg-8bit .dosaygo-y-path {
            animation: pulse-element 2s infinite ease-in-out alternate;
        }
        .dosaygo-logo-svg-8bit .dosaygo-circle-shape {
            animation: bob-element 1.5s infinite ease-in-out;
        }

        @keyframes bob-element {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-3px); /* Adjust bob intensity if needed */
            }
        }
        @keyframes pulse-element {
            from { opacity: 0.7; }
            to { opacity: 1; }
        }

        .splash-progress-bar-8bit-container {
            width: 240px;
            height: 24px;
            background-color: #000000;
            border: 3px solid #FFFFFF;
            padding: 2px;
            box-sizing: border-box;
            margin-bottom: 25px;
        }

        .splash-progress-8bit-fill {
            width: 0%;
            height: 100%;
            background-color: #FFFFFF;
            transition: width 0.05s linear;
        }

        .splash-status-text-8bit {
            font-size: 1em;
            text-transform: uppercase;
            animation: blink-text 1.2s infinite steps(1, end);
        }

        @keyframes blink-text {
            0%, 100% { visibility: visible; }
            50% { visibility: hidden; }
        }

    </style>
</head>
<body>

    <div id="splash-screen-8bit">
        <div class="splash-logo-container-8bit">
            <svg class="dosaygo-logo-svg-8bit" viewBox="14 0 72 108" xmlns="http://www.w3.org/2000/svg">
              <title>DOSAYGO Logo (8-bit, Tri-Axial, Chakra Colors)</title>
              <desc>8-bit style: Symmetrical 120-degree tri-axial Y shape (Red) with a Violet outlined circle floating closely above its crux.</desc>

              <!-- The 'Y' shape (Red - Root Chakra) -->
              <!-- Crux at (50,68). Stem length 30. Arm length 30. Stroke 10. -->
              <!-- Stem: M50,68 (crux) L50,98 (bottom) -->
              <!-- Left Arm: M50,68 (crux) L24.02,53 (tip: 50-30*cos(60), 68-30*sin(60) if axes were normal, but SVG Y is inverted )-->
              <!-- Corrected arm calculation for SVG: Xc +- L*sin(angle_from_vertical_up), Yc - L*cos(angle_from_vertical_up) -->
              <!-- Stem from crux (50,68) down to (50,98) -->
              <!-- Left arm from crux (50,68) to (50 - 30*sin(60deg_from_vert), 68 - 30*cos(60deg_from_vert)) -->
              <!-- sin(60) = 0.866, cos(60) = 0.5 -->
              <!-- Left arm tip: (50 - 30*0.866, 68 - 30*0.5) = (50 - 25.98, 68 - 15) = (24.02, 53) -->
              <!-- Right arm tip: (50 + 25.98, 53) = (75.98, 53) -->
              <path class="dosaygo-y-path"
                    d="M50,98 L50,68 M24.02,53 L50,68 L75.98,53"
                    stroke="#FF0000" stroke-width="10" fill="none"
                    stroke-linecap="butt" stroke-linejoin="miter"/>

              <!-- The Circle (Violet - Crown Chakra) -->
              <!-- Center (50,24). Radius 15. Stroke 8. -->
              <!-- Top of Y arms (visual center of stroke): y=53. Visual top edge: 53 - (10/2) = 48 -->
              <!-- Bottom of Circle (visual center of stroke): cy+r = 24+15 = 39. Visual bottom edge: 39 + (8/2) = 43 -->
              <!-- Gap: 48 (Y top) - 43 (Circle bottom) = 5 units. -->
              <circle class="dosaygo-circle-shape"
                      cx="50" cy="24" r="15"
                      fill="none" stroke="#9400D3" stroke-width="8"/>
            </svg>
        </div>
        <div class="splash-progress-bar-8bit-container">
            <div id="splash-progress-8bit-fill" class="splash-progress-8bit-fill"></div>
        </div>
        <div class="splash-status-text-8bit">Loading</div>
    </div>

    <script>
        const progressBarFill8bit = document.getElementById('splash-progress-8bit-fill');
        const statusText8bit = document.querySelector('.splash-status-text-8bit');
        let currentProgress8bit = 0;

        function updateSplashProgress8bit(percentage) {
            currentProgress8bit = Math.min(100, Math.max(0, percentage));
            if (progressBarFill8bit) {
                progressBarFill8bit.style.width = currentProgress8bit + '%';
            }
        }

        function hideSplashScreen8bit() {
            const splash8bit = document.getElementById('splash-screen-8bit');
            if (splash8bit) {
                splash8bit.style.opacity = '0';
                setTimeout(() => {
                    splash8bit.style.display = 'none';
                    document.body.style.overflow = 'auto';
                }, 200);
            }
        }

        let demoProgress8bit = 0;
        const demoInterval8bit = setInterval(() => {
            demoProgress8bit += Math.random() * 20 + 10;
            updateSplashProgress8bit(demoProgress8bit);

            if (demoProgress8bit >= 100) {
                clearInterval(demoInterval8bit);
                if (statusText8bit) {
                    statusText8bit.textContent = "READY";
                    statusText8bit.style.animation = 'none';
                    statusText8bit.style.visibility = 'visible';
                }
                setTimeout(hideSplashScreen8bit, 600);
            }
        }, 150);

        // --- HOW YOU'LL INTEGRATE ---
        // window.onload = function() {
        //     updateSplashProgress8bit(100);
        //     if (statusText8bit) {
        //         statusText8bit.textContent = "READY";
        //         statusText8bit.style.animation = 'none';
        //         statusText8bit.style.visibility = 'visible';
        //     }
        //     setTimeout(hideSplashScreen8bit, 600);
        // };
    </script>

</body>
</html>
